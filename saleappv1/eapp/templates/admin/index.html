{% extends 'admin/master.html' %}

{% block body %}

{% if current_user.is_authenticated %}

<div class="row">
  <div class="col-2">
    <img src="{{ current_user.avatar }}" class="img-fluid rounded" />
  </div>
  <div class="col-10">
    <h4 class="text-success">Chào {{ current_user.username }}!</h4>
  </div>
</div>

<div class="row mt-5">
  <div class="col-6">
    <table class="table">
      <tr>
        <th>Id</th>
        <th>Tên danh mục</th>
        <th>Số lượng</th>
      </tr>
      {% for s in stats %}
      <tr>
        <td>{{ s[0] }}</td>
        <td>{{ s[1] }}</td>
        <td>{{ s[2] }}</td>
      </tr>
      {% endfor %}
    </table>
  </div>
  <div class="col-6">
    <canvas id="myChart"></canvas>
  </div>
</div>

{% else %}
<h1 class="text-center text-success">ĐĂNG NHẬP QUẢN TRỊ</h1>

<form method="post" action="/login">
  <div class="form-group">
    <label for="username">Tên đăng nhập:</label>
    <input type="text" class="form-control" placeholder="Tên đăng nhập" id="username" name="username" />
  </div>
  <div class="form-group">
    <label for="pwd">Mật khẩu:</label>
    <input type="password" class="form-control" placeholder="Mật khẩu" id="pwd" name="password" />
  </div>
  <button type="submit" class="btn btn-primary">Đăng nhập</button>
</form>
{% endif %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  let data = [];
  let labels = [];

  {% for s in stats %}
  data.push({{ s[2] }});
  labels.push('{{ s[1] }}');
  {% endfor %}

  window.onload = function() {
    const ctx = document.getElementById('myChart');

    new Chart(ctx, {
      type: 'pie',
      data: {
        labels: labels,
        datasets: [{
          label: '# Số lượng',
          data: data,
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  }
</script>
{% endblock %}
